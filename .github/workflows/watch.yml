name: OVH VPS watch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test the purchase without paying (the cart is deleted)'
        type: boolean
        default: false
      force_found:
        description: 'Dry run only: pretend stock, as plan@datacenter (vps-2027-model3@DE)'
        type: string
        default: ''
permissions:
  issues: write
# One run at a time, so two runs can never both buy.
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check VPS-3 and VPS-2 (Linux) in Europe
        id: check
        run: |
          set -euo pipefail
          found=""
          for plan in vps-2027-model3 vps-2027-model2; do
            json=$(curl -sf --max-time 20 "https://eu.api.ovh.com/v1/vps/order/rule/datacenter?ovhSubsidiary=PL&planCode=$plan" || echo '{}')
            for dc in $(echo "$json" | jq -r '.datacenters[]? | select(.linuxStatus=="available") | .datacenter'); do
              case "$dc" in DE|WAW|GRA|SBG|EU-WEST-RBX|EU-SOUTH-MIL|UK) found="$found $plan@$dc" ;; esac
            done
          done
          if [ "${{ inputs.dry_run }}" = "true" ] && [ -n "${{ inputs.force_found }}" ]; then found=" ${{ inputs.force_found }}"; fi
          echo "in stock in Europe:${found:- none}"
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - name: Buy
        if: steps.check.outputs.found != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Pays only when the repository variable ARMED is 1 (set after the owner saw the dry run's prices); until then every run is a dry run.
          DRY_RUN: ${{ (inputs.dry_run || vars.ARMED != '1') && '1' || '0' }}
          OVH_APP_KEY: ${{ secrets.OVH_APP_KEY }}
          OVH_APP_SECRET: ${{ secrets.OVH_APP_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
        run: |
          pip install --quiet ovh==1.2.0
          python3 buy.py ${{ steps.check.outputs.found }}
      - name: Notify
        if: always() && steps.check.outputs.found != '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FOUND: ${{ steps.check.outputs.found }}
        run: |
          set -euo pipefail
          # One open issue at a time, so the mail comes once per stock window.
          open=$(gh issue list -R "$REPO" --label vps3-available --state open --json number --jq 'length')
          [ "$open" != "0" ] && exit 0
          gh label create vps3-available -R "$REPO" --color 0E8A16 2>/dev/null || true
          gh issue create -R "$REPO" --label vps3-available --assignee Piotrb029 \
            --title "OVH: dostępny VPS w Europie" \
            --body "Właśnie pojawił się VPS (Linux):$FOUND. Jeśli bot ma klucze API, sam zamówił (osobne zgłoszenie „zamówione …”): VPS-3 najpierw jako ulepszenie obecnego VPS-2, a gdy OVH odmówi, nowy serwer; drugi VPS-2 tylko wtedy, gdy VPS-3 jeszcze nie ma. Inaczej zamów ręcznie: https://www.ovhcloud.com/pl/vps/ Zamknij to zgłoszenie, żeby dostać kolejne powiadomienie."
